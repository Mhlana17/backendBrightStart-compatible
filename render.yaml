services:
  - type: web
    name: brightstart-backend
    runtime: docker
    plan: free
    region: frankfurt

    rootDir: backendBrightStart-master
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /actuator/health

    envVars:

      # ==========================================
      # SUPABASE DATABASE
      # ==========================================

      - key: DATABASE_URL
        sync: false

      - key: DATABASE_USERNAME
        sync: false

      - key: DATABASE_PASSWORD
        sync: false


      # ==========================================
      # JWT
      # ==========================================

      - key: JWT_SECRET
        sync: false

      # Optional: tighten this to the final Vercel URL after the frontend deploy.
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: http://localhost:5173,https://*.vercel.app
