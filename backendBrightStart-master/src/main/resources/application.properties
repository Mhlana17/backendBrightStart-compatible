spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

openai.enabled=${OPENAI_ENABLED:false}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

chatbot.rate-limit.requests=${CHATBOT_RATE_LIMIT_REQUESTS:20}
chatbot.rate-limit.window-seconds=${CHATBOT_RATE_LIMIT_WINDOW_SECONDS:60}
